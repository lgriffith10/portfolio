title: About Me
description: Learn more about my journey as a French-based Front-End Developer, my programming phylosophy, and my passion for building intuitive and powerful digital experiences.
content: |
  Hi, I'm **Luciano Griffith**, a Front-End Developer specializing in Vue.js and TypeScript, passionate about building performant, reliable, and user-focused web applications. Over the past three years, I’ve worked on digital products that don’t just look good — they deliver measurable value and align closely with business objectives.

  My journey began at the **University of Reims Champagne-Ardenne**, where I earned a degree in Web Development. That’s where I developed a strong foundation in both client-side technologies and software architecture — and discovered how thoughtful engineering decisions can directly impact user experience and product success.

  ### My Programming Philosophy

  I approach development with a product mindset: understanding the “why” behind each feature, optimizing for performance, and ensuring maintainability over time. I believe that great front-end work lives at the intersection of technical precision and business understanding — transforming complex requirements into scalable, high-quality code.

  While my main focus is front-end development, I’m also comfortable contributing to the backend when needed, using technologies like C# and Node.js to help create cohesive, full-stack solutions.

  ### What Drives Me

  What motivates me most is turning ideas into efficient, well-built digital experiences that truly serve users. I enjoy solving complex problems, refining performance, and collaborating with teams to deliver products that make a tangible difference.

  ### Beyond the Screen

  Outside of development, I’m passionate about travel and eager to discover new cultures — a short-term goal that motivates me to step out of my comfort zone and grow both personally and professionally. I’m also an active handball player and runner, as sports help me stay focused, disciplined, and constantly challenge myself — values I bring into my work as well.

  Thanks for stopping by. Feel free to contact me at griffith.luciano@gmail.com !
